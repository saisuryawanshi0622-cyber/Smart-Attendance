{% extends 'layout.html' %}

{% block content %}
<h1 class="page-title">Register New Student</h1>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form action="/register" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="name" required placeholder="e.g. Rahul Sharma">
        </div>
        
        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" name="roll" required placeholder="e.g. 101">
        </div>
        

        <div class="form-group">
            <label>Student Photo (Clear Face, Well Lit)</label>
            <input type="file" name="photo" id="photoInput" accept="image/jpeg, image/png" required style="background: transparent; border: none; padding: 0;">
            <div style="margin-top: 10px;">
                <img id="preview" src="#" alt="Photo Preview" style="display:none; max-width: 200px; border-radius: 10px; border: 2px solid var(--border);">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Save Student & Train Model</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('photoInput').onchange = function (evt) {
        var tgt = evt.target || window.event.srcElement,
            files = tgt.files;

        if (FileReader && files && files.length) {
            var fr = new FileReader();
            fr.onload = function () {
                document.getElementById('preview').src = fr.result;
                document.getElementById('preview').style.display = 'block';
            }
            fr.readAsDataURL(files[0]);
        }
    }
</script>
{% endblock %}
